name: Publish

on:
  release:
    types: [published]

  workflow_dispatch:

jobs:
  build-release-binaries:
    uses: ./.github/workflows/build-release-binaries.yml

  publish:
    needs: [build-release-binaries]
    name: publish
    runs-on: ubuntu-26.04

    environment:
      name: pypi
      url: https://pypi.org/p/vapoursynth-cambi

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
