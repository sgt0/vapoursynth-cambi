[package]
name = "cambi"
version = "1.1.5"
license = "MIT"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
const-str = "1.1.0"
kolor-64 = "0.1.9"
num-derive = "0.4.2"
num-traits = "0.2.19"
vapoursynth4-rs = "0.3.0"

[dev-dependencies]
approx = "=0.5.1"
criterion = { version = "=0.8.2", features = ["html_reports"] }

[[bench]]
name = "ceil_log2"
harness = false

[[bench]]
name = "pq_eotf"
harness = false

[profile.release]
codegen-units = 1
lto = true
